<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Saga Edition - Ficha de Personagem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="css/estilos.css">
    <script defer src="js/estado.js"></script>
    <script defer src="js/dados/classes.js"></script>
    <script defer src="js/dados/biblioteca.js"></script>
    <script defer src="js/dados/biblioteca-detalhes.js"></script>
    <script defer src="js/icones.js"></script>
    <script defer src="js/ficha.js"></script>
    <script defer src="js/referencia.js"></script>
    <script defer src="js/firebase.js"></script>
</head>
<body>

<div id="loginScreen">
    <div id="loginBox">
        <div class="brand-mark">SW</div>
        <h2>Star Wars RPG</h2>
        <p>Campanha: Will · 3980 BBY</p>
        <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
        <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password">
        <button id="btnLogin">Entrar</button>
        <div id="loginError"></div>
    </div>
</div>

<div class="container">
    <header class="app-header">
        <div class="brand">
            <div class="brand-mark">SW</div>
            <div>
                <h1>Star Wars <span>Saga Edition</span></h1>
                <p>Campanha: Will · 3980 BBY</p>
            </div>
        </div>

        <nav class="app-nav">
            <button class="nav-btn" onclick="openClassReference()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>
                Classes
            </button>
            <button class="nav-btn" onclick="openLibrary()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5z"/><path d="M8 7h7M8 11h5"/></svg>
                Biblioteca
            </button>
        </nav>

        <div id="userBar">
            <span id="syncStatus"></span>
            <span class="user-chip"><span id="userEmail"></span></span>
            <button id="btnLogout">Sair</button>
        </div>
    </header>

    <div class="tabs-container">
        <div class="tabs-header" id="tabsHeader"></div>
    </div>

    <main id="sheetsContainer"></main>
</div>

<!-- Classes -->
<div id="classModal" class="modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeClassReference()" aria-label="Fechar">&times;</button>
        <h2>Classes</h2>
        <div class="class-browser">
            <div class="class-selector" id="classSelector"></div>
            <div id="classDetails"></div>
        </div>
    </div>
</div>

<!-- Biblioteca -->
<div id="libraryModal" class="modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeLibrary()" aria-label="Fechar">&times;</button>
        <h2>Biblioteca</h2>
        <div class="library-tabs" id="libraryTabs"></div>
        <div class="library-layout">
            <div class="library-sidebar">
                <input type="search" id="librarySearch" class="library-search" placeholder="Buscar..." oninput="filterLibraryList(this.value)">
                <div class="library-list" id="libraryList"></div>
            </div>
            <div class="library-panel" id="libraryDetails"></div>
        </div>
    </div>
</div>

</body>
</html>
