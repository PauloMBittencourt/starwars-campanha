<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Ajustar ícones de raças</title>
<!-- Abra pelo servidor local (python dev/servidor.py): http://localhost:8765/dev/icones-especies/ajustar.html
     Mostra a imagem de fontes/ com o recorte do recortes.json (quadrado amarelo) e o ícone gerado ao lado. -->
<style>
    body { margin: 0; padding: 20px; background: #0c1119; color: #e8edf5; font: 13px 'Segoe UI', sans-serif; }
    h1 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 0 0 18px; color: #97a3b6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
    .card { display: flex; gap: 12px; padding: 12px; background: #151c28; border: 1px solid rgba(160,180,215,.15); border-radius: 12px; }
    .card h2 { margin: 0 0 8px; font-size: 14px; color: #ffe81f; }
    .card code { display: block; margin-top: 8px; font-size: 11px; color: #97a3b6; white-space: pre-wrap; }
    .source { position: relative; overflow: hidden; line-height: 0; background: #fff; }
    .source img { height: 240px; display: block; }
    .line-v, .line-h { position: absolute; background: rgba(255, 0, 80, .45); }
    .line-v { top: 0; bottom: 0; width: 1px; }
    .line-h { left: 0; right: 0; height: 1px; }
    .crop { position: absolute; border: 2px solid #ffe81f; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45); }
    .icon { width: 128px; height: 128px; }
    .missing { color: #ff5263; }
</style>
</head>
<body>
<h1>Ajustar ícones de raças</h1>
<p>Linhas vermelhas a cada 10%. Quadrado amarelo = recorte atual. Edite recortes.json, rode o script e recarregue esta página.</p>
<div class="grid" id="grid"></div>
<script>
    const lines = [...Array(9)].map((_, i) => (i + 1) * 10);

    fetch('recortes.json', { cache: 'no-store' })
        .then(response => response.json())
        .then(config => {
            const grid = document.getElementById('grid');
            Object.entries(config).forEach(([slug, cfg]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <h2>${slug}</h2>
                        <div class="source">
                            <img src="fontes/${cfg.arquivo}" alt="">
                            ${lines.map(p => `<div class="line-v" style="left:${p}%"></div><div class="line-h" style="top:${p}%"></div>`).join('')}
                            <div class="crop"></div>
                        </div>
                    </div>
                    <div>
                        <img class="icon" src="../../img/especies/${slug}.png?v=${Date.now()}" alt="" onerror="this.outerHTML='<p class=missing>ícone ainda não gerado</p>'">
                        <code>${JSON.stringify(cfg).replace(/,"/g, ',\n"')}</code>
                    </div>`;
                grid.appendChild(card);

                // O lado é em % da largura; a altura do quadrado depende da proporção da imagem
                const img = card.querySelector('.source img');
                const drawCrop = () => {
                    const crop = card.querySelector('.crop');
                    const ratio = img.naturalWidth / img.naturalHeight;
                    crop.style.left = `${cfg.x - cfg.lado / 2}%`;
                    crop.style.top = `${cfg.y}%`;
                    crop.style.width = `${cfg.lado}%`;
                    crop.style.height = `${cfg.lado * ratio}%`;
                };
                img.onerror = () => { card.querySelector('.source').outerHTML = `<p class="missing">não achei fontes/${cfg.arquivo}</p>`; };
                if (img.complete && img.naturalWidth) drawCrop(); else img.onload = drawCrop;
            });
        });
</script>
</body>
</html>
